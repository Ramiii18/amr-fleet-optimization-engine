# Continuous integration: the same four checks as local development, on every push and pull request.
# Runs on Windows (where development happens) and Linux (where Docker and deployment will run),
# so platform differences such as paths and line endings are caught early.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,viz,api]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Format check (ruff)
        run: python -m ruff format --check .

      - name: Type check (mypy)
        run: python -m mypy

      - name: Tests (pytest)
        run: python -m pytest

  container:
    # The service as a container image (D29): build it, start it, and check that it answers.
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build --tag amr-engine:ci .

      - name: Runs as an unprivileged user
        run: test "$(docker run --rm amr-engine:ci id -u)" = "10001"

      - name: Start
        run: docker run --detach --name amr --publish 127.0.0.1:8000:8000 amr-engine:ci

      - name: Answers health and a planning request
        run: |
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error --request POST http://127.0.0.1:8000/plan \
            --header "Content-Type: application/json" \
            --data '{"policy": "cpsat-fair", "robots": [{"id": "R1", "node": "PK00"}], "orders": [{"id": "O1", "pickup": "S00-02", "dropoff": "ST01", "release_tick": 0}]}' \
            | tee plan.json
          grep --quiet '"robot":"R1","order":"O1"' plan.json

      - name: Server log
        if: always()
        run: docker logs amr || true
