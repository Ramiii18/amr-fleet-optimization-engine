# Project metadata, dependencies and tool configuration, all in one file (PEP 517/518/621).
#
# Development install, from the repository root:
#     .venv\Scripts\python.exe -m pip install -e ".[dev]"

[build-system]
requires = ["setuptools>=77"] # 77+ understands the SPDX `license` expression below
build-backend = "setuptools.build_meta"

[project]
name = "amr-fleet-optimization-engine"
version = "0.0.1"
description = "Synthetic, simulation-based AMR fleet dispatch, routing and traffic optimization engine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
# Runtime dependencies. The core uses the standard library; each dependency is added when code
# needs it, with a reason (see docs/DECISIONS.md).
dependencies = [
    "numpy>=2.1", # cost matrices for optimal assignment (D16); 2.1 is the first with Python 3.13
    "scipy>=1.14", # linear_sum_assignment for Hungarian dispatch (D16); 1.14 supports Python 3.13
    "ortools>=9.15", # CP-SAT for bounded-horizon planning (D20); the version tested and benchmarked
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "networkx>=3.4", # reference oracle for tests only; never imported from src/
    "types-networkx", # type stubs so mypy can check the oracle tests
    "scipy-stubs", # type stubs so mypy strict can check the code that calls scipy
    "ruff>=0.8",
    "mypy>=1.13",
]
viz = ["matplotlib>=3.11"] # figures and animations (viz/, scripts/make_figures.py); 3.11 is tested

[project.scripts]
amr-sim = "amr_optimizer.cli:main" # the command-line runner, also `python -m amr_optimizer`

# --- Packaging: "src layout". The importable package lives in src/amr_optimizer. ---
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amr_optimizer = ["py.typed"] # marker file: "this package ships type hints"

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib", # no __init__.py needed in test folders; same file names allowed
    "-ra",                     # print a short summary of skipped/failed tests
    "--strict-markers",        # unknown @pytest.mark.<name> is an error, not a silent no-op
    "--strict-config",         # typos in this section are errors
]

# --- ruff: linter + formatter ---
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports/variables, undefined names
    "I",   # import sorting
    "B",   # flake8-bugbear: likely bugs (e.g. mutable default arguments)
    "UP",  # pyupgrade: modern Python syntax
    "N",   # pep8-naming
    "SIM", # simplifications
]

# --- mypy: static type checking ---
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
explicit_package_bases = true # module names come from folders: tests/unit/x.py -> tests.unit.x

[[tool.mypy.overrides]]
module = "tests.*"
# Tests may skip annotations; their bodies are still type-checked (strict enables check_untyped_defs).
disallow_untyped_defs = false
